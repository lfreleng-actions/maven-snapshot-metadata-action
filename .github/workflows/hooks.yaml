---
# SPDX-License-Identifier: Apache-2.0
# SPDX-FileCopyrightText: 2026 The Linux Foundation

# Tests the scripts the pre-commit hooks call. pre-commit.ci skips the
# hooks that use them, so they otherwise run only on contributors'
# machines, macOS among them, whose awk differs from Linux's.
name: "Test hook scripts 🪝"

# yamllint disable-line rule:truthy
on:
  workflow_dispatch:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

permissions: {}

jobs:
  manifest-guard:
    name: "Test manifest-guard.sh (${{ matrix.os }})"
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      # Harden-runner supports Linux runners only.
      # Load the egress allow-list out-of-band from the
      # organisation's .github repository and publish it as
      # $CONNECTION_ALLOW_LIST for the harden-runner step below.
      # yamllint disable-line rule:line-length
      - uses: lfreleng-actions/harden-runner-block-action@2fed66c9c36c4687c31ca349b925b81ec629673f  # v0.15.0
        if: runner.os == 'Linux'
        with:
          config: '@6d4a65c5601afd6c2fbe52bda4b0024b132f265d'  # v0.19.0

      # Harden the runner with the just-loaded allow-list.
      - name: 'Harden runner (block)'
        if: runner.os == 'Linux'
        # yamllint disable-line rule:line-length
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43  # v2.22.3
        with:
          egress-policy: 'block'
          allowed-endpoints: >
            ${{ env.CONNECTION_ALLOW_LIST }}

      - name: "Checkout repository"
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: "Run the manifest-guard.sh tests"
        shell: bash
        run: |
          # Run the manifest-guard.sh tests
          sh .github/hooks/manifest-guard-test.sh
